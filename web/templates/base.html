<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Metacritic Research{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/style.css?v={{ static_ver() }}">
</head>
<body>
<div class="layout">
    <nav class="sidebar">
        <div class="sidebar-top">
            <div class="bell bell-research" id="bell" title="Непросмотренные ресерчи">
                <span class="bell-icon">🔔︎</span>
                <span class="bell-badge" id="bell-badge">0</span>
                <div class="bell-panel" id="bell-panel">
                    <div class="bell-panel-title">Ресерчи</div>
                    <div class="bell-panel-list" id="bell-panel-list"></div>
                </div>
            </div>
            <div class="bell bell-letsplay" id="bell-lp" title="Непросмотренные ресерчи летсплеев">
                <span class="bell-icon">🔔︎</span>
                <span class="bell-badge" id="bell-lp-badge">0</span>
                <div class="bell-panel" id="bell-lp-panel">
                    <div class="bell-panel-title">Ресерчи летсплеев</div>
                    <div class="bell-panel-list" id="bell-lp-panel-list"></div>
                </div>
            </div>
            <div class="sidebar-divider"></div>
            <a href="/" class="nav-btn" title="Все игры">🎲</a>
            <a href="/settings" class="nav-btn" title="Настройки">⚙️</a>
            <div class="sidebar-divider"></div>
        </div>
        <div class="sidebar-bottom">
            <button class="nav-btn run-btn" id="run-btn" title="Загрузить игровые обновления">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
            </button>
            <button class="nav-btn lp-btn" id="lp-btn" title="Обновить летсплеи">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
            </button>
        </div>
    </nav>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
</div>

<div class="lp-modal" id="run-modal">
    <div class="lp-modal-content">
        <div class="lp-modal-header">
            <span>Запуск ресерча игр</span>
            <button class="lp-modal-close" id="run-modal-close">✕</button>
        </div>
        <div class="lp-modal-body">
            <label class="run-option">
                <input type="radio" name="run-mode" value="check" checked>
                <span>Обработать игры, неизвестные на момент предыдущего сегодняшнего ресерча <span id="run-check-hint">(данных нет)</span></span>
            </label>
            <label class="run-option">
                <input type="radio" name="run-mode" value="reset">
                <span>Обнулить день, обновить данные всех релизов <span id="run-reset-hint">за сегодня</span>. История сегодняшних ресерчей удалится.</span>
            </label>
        </div>
        <div class="lp-modal-footer">
            <button class="lp-run-btn" id="run-modal-run">Запустить</button>
        </div>
    </div>
</div>

<div class="lp-modal" id="lp-modal">
    <div class="lp-modal-content">
        <div class="lp-modal-header">
            <span>Обновить летсплеи</span>
            <button class="lp-modal-close" id="lp-modal-close">✕</button>
        </div>
        <div class="lp-modal-body">
            <label class="lp-research-row">
                <input type="checkbox" id="lp-research-check">
                <span id="lp-research-label">Игры последнего ресерча: загрузка...</span>
            </label>
            <div class="lp-games-grid" id="lp-games-grid"></div>
        </div>
        <div class="lp-modal-footer">
            <button class="lp-run-btn" id="lp-run-btn">Запустить</button>
        </div>
    </div>
</div>

<script src="/static/js/app.js?v={{ static_ver() }}"></script>
</body>
</html>
